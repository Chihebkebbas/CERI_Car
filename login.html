<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - CERI Car</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=DM+Sans:opsz,wght@9..40,400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">


    <link rel="stylesheet" href="auth.css">
</head>
<body>

<header role="banner">
    <div class="header-container">
        <a href="#accueil" class="logo">
            CERI<span class="logo-dot">.</span><span class="logo-red">Car</span>
        </a>
        <nav role="navigation">
            <ul class="nav-items">
                <li><a href="Acceuil.html#accueil">Explorer</a></li>
                <li><a href="Acceuil.html#villes">Destinations</a></li>
                <li><a href="Acceuil.html#concept">Concept</a></li>
            </ul>
        </nav>
        <div class="right-nav">
            <a href="login.html" class="btn-text">Connexion</a>
            <a href="signup.html" class="btn-primary">S'inscrire</a>
        </div>
    </div>
</header>

<div class="auth-main">
    <section class="auth-card">
        <div class="auth-header">
            <h1 class="auth-title">Bon retour</h1>
            <p class="auth-subtitle">Connectez-vous pour poursuivre votre voyage.</p>
        </div>

        <form class="auth-form" action="#" method="POST">
            <div class="form-group">
                <label for="email" class="form-label">Adresse e-mail</label>
                <input type="email" id="email" name="email" class="form-input" placeholder="nom@exemple.com" required>
            </div>

            <div class="form-group">
                <label for="password" class="form-label">Mot de passe</label>
                <input type="password" id="password" name="password" class="form-input" placeholder="••••••••" required>
            </div>

            <button type="submit" class="auth-submit">Se connecter</button>
        </form>

        <div class="auth-footer">
            <p>Pas encore de compte ? <a href="signup.html" class="auth-link">Créer un profil</a></p>
        </div>
    </section>
</div>

<footer role="contentinfo">
    <div class="footer-content">
        <div class="footer-brand">
            <a href="#accueil" class="logo">CERI<span class="logo-dot">.</span><span class="logo-red">Car</span></a>
            <p>Le covoiturage nouvelle génération.</p>
        </div>
        <div class="footer-links">
            <a href="#">Explorer</a>
            <a href="#">Destinations</a>
            <a href="#">Concept</a>
        </div>
    </div>
    <div class="footer-bottom">
        <p>&copy; 2025 CERI Car. Conçu par <span class="chiheb">Chiheb Eddine KEBBAS</span>.</p>
    </div>
</footer>

</body>
</html>
